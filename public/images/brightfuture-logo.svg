<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#1e40af" rx="10"/>
  
  <!-- Building structure -->
  <g transform="translate(50, 40)">
    <!-- Main building -->
    <rect x="20" y="30" width="60" height="80" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
    
    <!-- Roof -->
    <polygon points="20,30 80,30 50,0" fill="#dc2626"/>
    
    <!-- Windows -->
    <rect x="30" y="45" width="12" height="12" fill="#1e40af"/>
    <rect x="50" y="45" width="12" height="12" fill="#1e40af"/>
    <rect x="68" y="45" width="12" height="12" fill="#1e40af"/>
    
    <rect x="30" y="65" width="12" height="12" fill="#1e40af"/>
    <rect x="50" y="65" width="12" height="12" fill="#1e40af"/>
    <rect x="68" y="65" width="12" height="12" fill="#1e40af"/>
    
    <rect x="30" y="85" width="12" height="12" fill="#1e40af"/>
    <rect x="50" y="85" width="12" height="12" fill="#1e40af"/>
    <rect x="68" y="85" width="12" height="12" fill="#1e40af"/>
    
    <!-- Door -->
    <rect x="43" y="100" width="14" height="30" fill="#92400e" stroke="#78350f" stroke-width="1"/>
    <circle cx="56" cy="115" r="2" fill="#fbbf24"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">BrightFuture</text>
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="12" fill="#e0e7ff" text-anchor="middle">Builders</text>
</svg>
