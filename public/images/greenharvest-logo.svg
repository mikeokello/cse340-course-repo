<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#0f766e" rx="10"/>
  
  <!-- Soil -->
  <ellipse cx="100" cy="150" rx="60" ry="30" fill="#92400e" opacity="0.6"/>
  
  <!-- Plants -->
  <g transform="translate(40, 80)">
    <!-- Left plant -->
    <line x1="15" y1="50" x2="15" y2="10" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="10" cy="15" rx="6" ry="8" fill="#22c55e" transform="rotate(-30 10 15)"/>
    <ellipse cx="20" cy="20" rx="6" ry="8" fill="#22c55e" transform="rotate(30 20 20)"/>
    <ellipse cx="15" cy="30" rx="5" ry="7" fill="#16a34a" transform="rotate(-20 15 30)"/>
    <ellipse cx="15" cy="40" rx="5" ry="7" fill="#16a34a" transform="rotate(20 15 40)"/>
  </g>
  
  <g transform="translate(100, 70)">
    <!-- Center plant (taller) -->
    <line x1="15" y1="60" x2="15" y2="5" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="8" cy="10" rx="7" ry="10" fill="#22c55e" transform="rotate(-35 8 10)"/>
    <ellipse cx="22" cy="18" rx="7" ry="10" fill="#22c55e" transform="rotate(35 22 18)"/>
    <ellipse cx="15" cy="30" rx="6" ry="9" fill="#16a34a" transform="rotate(-25 15 30)"/>
    <ellipse cx="15" cy="45" rx="6" ry="9" fill="#16a34a" transform="rotate(25 15 45)"/>
  </g>
  
  <g transform="translate(150, 85)">
    <!-- Right plant -->
    <line x1="15" y1="45" x2="15" y2="15" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="9" cy="18" rx="6" ry="8" fill="#22c55e" transform="rotate(-30 9 18)"/>
    <ellipse cx="21" cy="25" rx="6" ry="8" fill="#22c55e" transform="rotate(30 21 25)"/>
    <ellipse cx="15" cy="35" rx="5" ry="7" fill="#16a34a" transform="rotate(-20 15 35)"/>
  </g>
  
  <!-- Sun -->
  <circle cx="160" cy="40" r="15" fill="#fbbf24"/>
  <line x1="160" y1="15" x2="160" y2="5" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="185" y1="40" x2="195" y2="40" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="178" y1="25" x2="186" y2="17" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Text -->
  <text x="100" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">GreenHarvest</text>
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="12" fill="#d1fae5" text-anchor="middle">Growers</text>
</svg>
